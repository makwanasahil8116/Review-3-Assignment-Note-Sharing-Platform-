<!DOCTYPE html>
<html>
<head>
    <title>Video Example</title>
</head>
<body>

<h2>College Introduction Video</h2>

<video controls width="500" src="college.mp4">
    Your browser does not support video.
</video>
<video 
    controls 
    width="500"
    src="college.mp4"
    poster="college.jpg">
</video>
<video controls loop width="500" src="college.mp4"></video>
<iframe 
    src="https://www.example.com"
    width="600"
    height="400">
</iframe>

<iframe 
    width="560"
    height="315"
    src="https://www.youtube.com/embed/VIDEO_ID"
    title="YouTube video"
    allowfullscreen>
</iframe>
<iframe
    src="GOOGLE_MAP_EMBED_URL"
    width="600"
    height="450">
</iframe>
<iframe
    src="GOOGLE_MAP_EMBED_URL"
    width="600"
    height="450">
</iframe>
<input type="text" pattern="[A-Za-z]+">
<label>Mobile Number:</label>

<input 
    type="text"
    pattern="[0-9]{10}"
    required>
</body>
</html>
